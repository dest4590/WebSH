[package]
name = "websh-shell-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# # do not update, it will break the build
# getrandom = { version = "0.4.2", features = ["js"] }
# # ---------------------------------------
getrandom04 = { package = "getrandom", version = "0.4.2", features = ["wasm_js"] }
js-sys = "0.3.99"
russh = { version = "0.61.1", default-features = false, features = [
    "ring",
    "rsa",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tokio = { version = "1.52.3", features = ["sync", "io-util"] }
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = { version = "0.3.99", features = ["console"] }
