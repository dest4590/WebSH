[package]
name = "websh-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.32"
argon2 = "0.5.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.33"
tokio = { version = "1.52.3", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower-http = { version = "0.6.11", features = ["cors"] }
tower_governor = "0.8.0"
dotenvy = "0.15.7"
tokio-tungstenite = "0.29.0"
bytes = "1.11.1"
getrandom = "0.4.2"
governor = "0.10.4"
chrono = { version = "0.4.44", default-features = false, features = ["now"] }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
