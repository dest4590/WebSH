name: Build and publish Docker images

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Cache Docker Buildx state
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/.buildx-cache
                  key: ${{ runner.os }}-buildx-backend-${{ hashFiles('backend/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-buildx-backend-

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push backend
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: backend/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/websh-backend:latest
                      ghcr.io/${{ github.repository_owner }}/websh-backend:${{ github.sha }}
                  cache-from: |
                      type=gha
                      type=local,src=${{ runner.temp }}/.buildx-cache
                  cache-to: |
                      type=gha,mode=max
                      type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
                  platforms: linux/amd64

            - name: Save Buildx cache
              if: always()
              run: |
                  rm -rf "${{ runner.temp }}/.buildx-cache"
                  mv "${{ runner.temp }}/.buildx-cache-new" "${{ runner.temp }}/.buildx-cache"

    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Cache Docker Buildx state
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/.buildx-cache
                  key: ${{ runner.os }}-buildx-frontend-${{ hashFiles('frontend/package-lock.json', 'frontend/yarn.lock', 'frontend/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-buildx-frontend-

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push frontend
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: frontend/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: |
                      ghcr.io/${{ github.repository_owner }}/websh-frontend:latest
                      ghcr.io/${{ github.repository_owner }}/websh-frontend:${{ github.sha }}
                  cache-from: |
                      type=gha
                      type=local,src=${{ runner.temp }}/.buildx-cache
                  cache-to: |
                      type=gha,mode=max
                      type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max
                  platforms: linux/amd64

            - name: Save Buildx cache
              if: always()
              run: |
                  rm -rf "${{ runner.temp }}/.buildx-cache"
                  mv "${{ runner.temp }}/.buildx-cache-new" "${{ runner.temp }}/.buildx-cache"
